<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antes del Step 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Karla:ital,wght@0,300..600;1,300..500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#101832;
    --night-deep:#080D1C;
    --bone:#F2E9DC;
    --dim:#8E97B4;
    --hilo:#D42B2B;
    --hilo-dim:#7C2222;
    --gold:#C9A227;
    --rail:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    background:
      radial-gradient(120% 80% at 15% 100%, #1A2140 0%, transparent 60%),
      radial-gradient(90% 60% at 90% 0%, #16203E 0%, transparent 55%),
      var(--night-deep);
    color:var(--bone);
    font-family:"Karla", ui-sans-serif, system-ui, sans-serif;
    font-weight:350;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- el hilo rojo (left rail) ---------- */
  .rail{
    position:fixed; inset:0 auto 0 0;
    width:var(--rail); height:100dvh;
    pointer-events:none; z-index:2;
  }
  .rail svg{width:100%;height:100%;display:block}
  .thread{
    fill:none;
    stroke:var(--hilo);
    stroke-width:1.6;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
    transition:stroke-dashoffset 1000ms cubic-bezier(.22,.61,.36,1);
  }
  .thread-ghost{
    fill:none;
    stroke:var(--hilo-dim);
    stroke-width:1.6;
    stroke-linecap:round;
    opacity:.28;
    vector-effect:non-scaling-stroke;
  }
  .knot{
    position:absolute; left:50%;
    width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
    border-radius:50%;
    background:var(--night-deep);
    border:1.6px solid var(--hilo-dim);
    transform:scale(.7);
    opacity:.45;
    transition:transform 420ms cubic-bezier(.34,1.56,.64,1), background 420ms, border-color 420ms, opacity 420ms;
  }
  .knot.tied{background:var(--hilo);border-color:var(--hilo);opacity:1;transform:scale(1)}
  .knot.now{transform:scale(1.5);box-shadow:0 0 0 5px rgba(212,43,43,.14)}

  /* ---------- stage ---------- */
  .stage{
    min-height:100dvh;
    padding:clamp(28px,6vh,72px) clamp(22px,5vw,72px) clamp(28px,6vh,64px) calc(var(--rail) + clamp(14px,4vw,64px));
    display:flex; flex-direction:column;
  }
  .masthead{
    font-size:.72rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--dim); font-weight:500;
  }
  .masthead b{color:var(--bone);font-weight:500}

  main{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    max-width:56rem; padding:clamp(24px,7vh,64px) 0;
  }
  .card{
    transition:opacity 240ms ease, transform 240ms ease;
  }
  .layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:clamp(28px,4.5vw,60px);
    align-items:center;
  }
  .photo{
    margin:0;
    width:clamp(190px,23vw,272px);
    padding:9px 9px 9px;
    background:#EDE3D5;
    border-radius:2px;
    box-shadow:0 18px 40px rgba(0,0,0,.42);
    transform:rotate(1.6deg);
  }
  .photo img{
    display:block; width:100%; aspect-ratio:4/5;
    object-fit:cover; border-radius:1px;
    background:#1A2140;
  }
  @media (max-width:760px){
    .layout{grid-template-columns:1fr; gap:22px; justify-items:start}
    .photo{width:min(52vw,190px); transform:rotate(-1.4deg); order:-1}
  }
  .card.out{opacity:0; transform:translateY(10px)}

  .eyebrow{
    display:flex; align-items:baseline; gap:.9rem;
    margin:0 0 1.1rem;
    font-size:.74rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold); font-weight:500;
  }
  .eyebrow .count{color:var(--dim); letter-spacing:.14em}
  .eyebrow .rule{flex:1; height:1px; background:linear-gradient(90deg,rgba(201,162,39,.45),transparent)}

  h1{
    font-family:"Fraunces", Georgia, serif;
    font-optical-sizing:auto;
    font-weight:400;
    font-size:clamp(2rem,5.6vw,3.5rem);
    line-height:1.06;
    letter-spacing:-.015em;
    margin:0 0 1.4rem;
    text-wrap:balance;
  }
  h1 em{font-style:italic; color:var(--bone)}
  .body p{
    font-size:clamp(1.02rem,1.9vw,1.2rem);
    line-height:1.62;
    color:#DCD5C9;
    margin:0 0 1rem;
    max-width:36rem;
  }
  .body p:last-child{margin-bottom:0}
  .es{font-family:"Fraunces",Georgia,serif; font-style:italic; color:var(--bone)}
  .red{color:var(--hilo)}

  /* ---------- controls ---------- */
  .controls{
    display:flex; align-items:center; gap:1.2rem;
    margin-top:clamp(2rem,5vh,3rem);
  }
  button{
    font-family:"Karla",sans-serif; font-size:.86rem; letter-spacing:.12em;
    text-transform:uppercase; font-weight:500;
    cursor:pointer; border-radius:2px;
    transition:background 180ms, color 180ms, border-color 180ms, opacity 180ms;
  }
  .next{
    background:transparent; color:var(--bone);
    border:1px solid rgba(242,233,220,.38);
    padding:.85rem 1.6rem;
  }
  .next:hover{background:var(--bone); color:var(--night-deep); border-color:var(--bone)}
  .back{
    background:none; border:none; color:var(--dim);
    padding:.85rem 0; text-transform:none; letter-spacing:.04em;
  }
  .back:hover{color:var(--bone)}
  .back[hidden]{display:none}
  button:focus-visible{outline:2px solid var(--gold); outline-offset:3px}

  .hint{
    font-size:.72rem; color:#5F6884; letter-spacing:.08em;
  }

  @media (max-width:600px){
    :root{--rail:38px}
    .masthead{font-size:.66rem}
    .controls{flex-wrap:wrap; gap:.6rem 1.2rem}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:1ms !important; animation:none !important}
  }
</style>
</head>
<body>

<div class="rail" id="rail">
  <svg viewBox="0 0 60 660" preserveAspectRatio="none" aria-hidden="true">
    <path class="thread-ghost" id="ghost"></path>
    <path class="thread" id="thread"></path>
  </svg>
</div>

<div class="stage">
  <div class="masthead">para Malala &nbsp;·&nbsp; <b>antes del Step 1</b></div>

  <main>
    <article class="card" id="card" aria-live="polite">
      <div class="layout">
        <div>
          <div class="eyebrow"><span id="es-label"></span><span class="count" id="count"></span><span class="rule"></span></div>
          <h1 id="title"></h1>
          <div class="body" id="body"></div>
        </div>
        <figure class="photo"><img id="photo" alt="Malala y Chris"></figure>
      </div>
    </article>

    <div class="controls">
      <button class="next" id="next">Next</button>
      <button class="back" id="back" hidden>Back</button>
      <span class="hint">or press &crarr;</span>
    </div>
  </main>
</div>

/* ---------- draw the thread ---------- */
const N = CARDS.length, H = 660, W = 60, AMP = 10;
const seg = H / N;
let d = "";
for (let y = 0; y <= H; y += 3) {
  const x = (W / 2 + AMP * Math.sin((2 * Math.PI * y) / seg)).toFixed(2);
  d += (y === 0 ? "M" : "L") + x + " " + y + " ";
}
document.getElementById("ghost").setAttribute("d", d);
const thread = document.getElementById("thread");
thread.setAttribute("d", d);
const L = thread.getTotalLength();
thread.style.strokeDasharray = L;
thread.style.strokeDashoffset = L;

const rail = document.getElementById("rail");
const knots = CARDS.map((_, i) => {
  const k = document.createElement("div");
  k.className = "knot";
  k.style.top = (((i + 0.5) * seg) / H) * 100 + "%";
  rail.appendChild(k);
  return k;
});

/* ---------- cards ---------- */
const card = document.getElementById("card");
const nextBtn = document.getElementById("next");
const backBtn = document.getElementById("back");
let i = 0, busy = false;

function paint() {
  const c = CARDS[i];
  document.getElementById("es-label").textContent = c.es;
  document.getElementById("count").textContent = (i + 1) + " / " + N;
  document.getElementById("title").innerHTML = c.title;
  document.getElementById("body").innerHTML = c.body.map(p => "<p>" + p + "</p>").join("");
  if (c.pic && PICS[c.pic]) document.getElementById("photo").src = PICS[c.pic];

  const last = i === N - 1;
  nextBtn.textContent = last ? (c.cta || "Close") : "Next";
  nextBtn.hidden = false;
  backBtn.hidden = i === 0;

  const revealY = (i + 0.5) * seg + seg * 0.35;
  thread.style.strokeDashoffset = L - L * Math.min(revealY / H, 1);
  knots.forEach((k, n) => {
    k.classList.toggle("tied", n <= i);
    k.classList.toggle("now", n === i);
  });
}

function go(step) {
  const target = i + step;
  if (busy || target < 0 || target >= N) return;
  busy = true;
  card.classList.add("out");
  setTimeout(() => {
    i = target;
    paint();
    card.classList.remove("out");
    busy = false;
  }, 240);
}

nextBtn.addEventListener("click", () => {
  if (i === N - 1) {
    document.getElementById("title").innerHTML = "Nos vemos mañana.";
    document.getElementById("body").innerHTML = "<p>Ahora sí, a estudiar. <span class='es'>Tú puedes.</span></p>";
    nextBtn.hidden = true;
    return;
  }
  go(1);
});
backBtn.addEventListener("click", () => go(-1));

document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight") {
    if (document.activeElement === backBtn) return;
    e.preventDefault(); nextBtn.click();
  }
  if (e.key === "ArrowLeft") go(-1);
});

paint();
</script>
